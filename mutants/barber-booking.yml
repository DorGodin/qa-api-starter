# Mutation catalogue for the barbershop (github.com/DorGodin/barber-booking-api).
#
# Each mutant breaks one rule of the product on purpose and names the suite that
# must notice: api (tests/barber), ui (tests/barber_ui, a real browser), ui-webkit
# (the phone tests on Safari's engine, for defects only Safari has) or load
# (perf/barber/booking_race.js). `find` must appear exactly once in `file`;
# `make mutate-check` fails when the product changes under an anchor.
#
#   make mutate          run them all, report every survivor
#   make mutate-check    anchors only, in seconds
product: barber-booking
mutants:
- name: the booking lock is silently ignored (the real bug from stage 2)
  file: app/db.py
  catches:
  - api
  changes: &id001
  - find: |2-
          if session.in_transaction():
              session.commit()
          session.connection
    replace: '    session.connection'
- name: the booking lock is silently ignored, under load
  file: app/db.py
  catches:
  - load
  changes: *id001
- name: back-to-back counted as an overlap
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: return self.start < other.end and other.start < self.end
    replace: return self.start <= other.end and other.start <= self.end
- name: a service ending exactly at closing is refused
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: return self.start <= other.start and other.end <= self.end
    replace: return self.start <= other.start and other.end < self.end
- name: a fixed +02:00 offset instead of the time zone
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: |2-
          wall = datetime.combine(day, time(minute_of_day // 60, minute_of_day % 60), tzinfo=tz)
          return wall.astimezone(UTC)
    replace: |2-
          wall = datetime.combine(day, time(minute_of_day // 60, minute_of_day % 60))
          return (wall - timedelta(hours=2)).replace(tzinfo=UTC)
