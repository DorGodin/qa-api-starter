# Mutation catalogue for the barbershop (github.com/DorGodin/barber-booking-api).
#
# Each mutant breaks one rule of the product on purpose and names the suite that
# must notice: api (tests/barber), ui (tests/barber_ui, a real browser) or load
# (perf/barber/booking_race.js). `find` must appear exactly once in `file`;
# `make mutate-check` fails when the product changes under an anchor.
#
#   make mutate          run them all, report every survivor
#   make mutate-check    anchors only, in seconds
product: barber-booking
mutants:
- name: the booking lock is silently ignored (the real bug from stage 2)
  file: app/db.py
  catches:
  - api
  changes: &id001
  - find: |2-
          if session.in_transaction():
              session.commit()
          session.connection
    replace: '    session.connection'
- name: the booking lock is silently ignored, under load
  file: app/db.py
  catches:
  - load
  changes: *id001
- name: back-to-back counted as an overlap
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: return self.start < other.end and other.start < self.end
    replace: return self.start <= other.end and other.start <= self.end
- name: a service ending exactly at closing is refused
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: return self.start <= other.start and other.end <= self.end
    replace: return self.start <= other.start and other.end < self.end
- name: a fixed +02:00 offset instead of the time zone
  file: app/scheduling.py
  catches:
  - api
  changes:
  - find: |2-
          wall = datetime.combine(day, time(minute_of_day // 60, minute_of_day % 60), tzinfo=tz)
          return wall.astimezone(UTC)
    replace: |2-
          wall = datetime.combine(day, time(minute_of_day // 60, minute_of_day % 60))
          return (wall - timedelta(hours=2)).replace(tzinfo=UTC)
- name: the Idempotency-Key is ignored
  file: app/routers/bookings.py
  catches:
  - api
  changes:
  - find: |2-
              if idempotency_key is not None:
                  seen =
    replace: |2-
              if False:
                  seen =
- name: somebody else's booking answers 403, not 404
  file: app/routers/bookings.py
  catches:
  - api
  changes:
  - find: |2-
          if user.role == "customer" and booking.customer_id != user.id:
              raise not_found("booking")
    replace: |2-
          if user.role == "customer" and booking.customer_id != user.id:
              raise DomainError(403, "forbidden", "not yours")
- name: the 24 hour cancellation cutoff is gone
  file: app/routers/bookings.py
  catches:
  - api
  changes:
  - find: if user.role == "customer" and booking.start_utc - now < timedelta
    replace: if False and booking.start_utc - now < timedelta
- name: a customer can sit in two chairs
  file: app/routers/bookings.py
  catches:
  - api
  changes:
  - find: '        if clashes(wanted, busy(session, wanted, customer_id=user.id)):'
    replace: '        if False:'
- name: a price change reaches back into bookings
  file: app/views.py
  catches:
  - api
  changes:
  - find: '"price_minor": booking.price_minor,'
    replace: '"price_minor": __import__("sqlalchemy").inspect(booking).session.get(__import__("app.models", fromlist=["Service"]).Service, booking.service_id).price_minor,'
- name: availability offers a customer times that clash with their own booking
  file: app/routers/barbers.py
  catches:
  - api
  changes:
  - find: |2-
              if user.role == "customer":
                  taken += busy(session, window, customer_id=user.id)
    replace: '        pass'
- name: a barber can cancel
  file: app/routers/bookings.py
  catches:
  - api
  changes:
  - find: |2-
              if user.role == "barber":
                  raise DomainError(403,
    replace: |2-
              if False:
                  raise DomainError(403,
