      function book() {
        if (!selected || booking) return;
    replace: |-
      function book() {
        if (!selected) return;
  - find: |2-
        booking = true;
        $("book").disabled = true;
    replace: '  booking = true;'
- name: refusals shown as raw codes
  file: app/static/index.html
  catches:
