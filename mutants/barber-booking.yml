    replace: '  if (code) return code;'
- name: a failed booking does not refresh the times
  file: app/static/index.html
  catches:
  - ui
  changes:
  - find: |2-
          popup(taken ? "השעה כבר תפוסה" : "לא הצלחנו לקבוע את התור", reason, "error");
        }
        await refresh();
    replace: |2-
          popup(taken ? "השעה כבר תפוסה" : "לא הצלחנו לקבוע את התור", reason, "error");
          return;
        }
        await refresh();
