name: install the browsers
description: >-
  Playwright's browsers, cached by the lock (which pins the Playwright version), and
  their system packages. A cached browser is not downloaded again; the system
  packages always are, from Ubuntu's mirrors, and that download is what has hung.
inputs:
  browsers:
    description: the engines to install, e.g. "chromium" or "chromium webkit"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('requirements.lock.txt') }}
    - name: let apt give up on a stalled mirror and retry, by itself
      # A download that stalls hung the install for an hour once. The first fix
      # wrapped the install in `timeout` and tried twice: `timeout` stops the
      # Playwright process, but the apt it started keeps running and holding
      # dpkg's lock, so the second try failed at once on "Unable to acquire the
      # dpkg frontend lock". The retry belongs to apt: a connection idle for 30
      # seconds is dropped and the file fetched again, up to five times.
      shell: bash
      run: |
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
          | sudo tee /etc/apt/apt.conf.d/80-stalled-mirrors >/dev/null
    - name: install ${{ inputs.browsers }}
      shell: bash
      run: python -m playwright install --with-deps ${{ inputs.browsers }}
