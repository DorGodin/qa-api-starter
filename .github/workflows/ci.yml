name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  unit:
    name: unit (no API, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: PYTHONPATH=. pytest --unit tests/unit

  suites:
    name: product suites + edge cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --edge-cases --security

  ui:
    name: browser suite (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --ui tests/ui

  perf:
    name: perf smoke (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - uses: grafana/setup-k6-action@v1
      - run: k6 run perf/smoke.js

  llm:
    name: llm evaluation (deepeval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --llm tests/llm

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and run the suites in containers
        run: docker compose run --rm tests
      - name: stop
        if: always()
        run: docker compose down -v

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
