name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # The heavy shapes nightly. They take minutes, so they do not belong on a PR.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit:
    name: unit (no API, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: PYTHONPATH=. pytest --unit tests/unit

  suites:
    name: product suites + edge cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --edge-cases --security

  ui:
    name: browser suite (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --ui tests/ui

  perf:
    name: perf smoke + load + write path (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - uses: grafana/setup-k6-action@v1
      - name: smoke - does it work at all under one user
        run: k6 run perf/smoke.js
      - name: read path under concurrency
        run: k6 run -e VUS=5 -e RAMP=3s -e HOLD=7s perf/load.js
      - name: write path under concurrency - money math is a gate here
        run: k6 run -e VUS=5 -e RAMP=3s -e HOLD=7s perf/write_path.js

  perf-heavy:
    name: perf spike + soak (k6, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - uses: grafana/setup-k6-action@v1
      - name: spike - survive a sudden 5x and recover
        run: k6 run -e PROFILE=spike -e VUS=5 -e HOLD=15s perf/write_path.js
      - name: soak - hold the load and look for leaks
        run: k6 run -e PROFILE=soak -e VUS=5 -e HOLD=3m perf/write_path.js

  llm:
    name: llm evaluation (deepeval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --llm tests/llm

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and run the suites in containers
        run: docker compose run --rm tests
      - name: stop
        if: always()
        run: docker compose down -v

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
