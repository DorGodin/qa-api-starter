name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    # The heavy shapes nightly. They take minutes, so they do not belong on a PR.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit:
    name: unit (no API, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: PYTHONPATH=. pytest --unit tests/unit

  suites:
    name: product suites + edge cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --edge-cases --security

  ui:
    name: browser suite (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - run: python -m playwright install --with-deps chromium
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --ui tests/ui

  perf:
    name: perf smoke + load + write path (k6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - uses: grafana/setup-k6-action@v1
      # Through perf_run.py, as locally: k6's output unchanged, one row per run in
      # reports/perf.jsonl, and k6's exit code passed back so a crossed threshold
      # still fails the job.
      - name: smoke - does it work at all under one user
        run: python scripts/perf_run.py perf/smoke.js --profile smoke
      - name: read path under concurrency
        run: python scripts/perf_run.py perf/load.js --profile load -e VUS=5 -e RAMP=3s -e HOLD=7s
      - name: write path under concurrency - money math is a gate here
        run: python scripts/perf_run.py perf/write_path.js --profile load -e VUS=5 -e RAMP=3s -e HOLD=7s
      - name: perf dashboard
        if: always()
        run: python scripts/dashboard.py
      - name: keep this run's numbers
        # always(): the run that crossed a threshold is the one whose numbers you want.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          path: |
            reports/perf.jsonl
            reports/dashboard.html
          if-no-files-found: ignore
          retention-days: 14

  perf-heavy:
    name: perf spike + soak (k6, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - uses: grafana/setup-k6-action@v1
      - name: spike - survive a sudden 5x and recover
        run: python scripts/perf_run.py perf/write_path.js --profile spike -e VUS=5 -e HOLD=15s
      - name: soak - hold the load and look for leaks
        if: always()
        run: python scripts/perf_run.py perf/write_path.js --profile soak -e VUS=5 -e HOLD=3m
      - name: perf dashboard
        if: always()
        run: python scripts/dashboard.py
      - name: keep this run's numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-heavy-${{ github.run_id }}
          path: |
            reports/perf.jsonl
            reports/dashboard.html
          if-no-files-found: ignore
          retention-days: 30

  barber:
    name: barbershop - a second product, in its own repository
    timeout-minutes: 45
    env:
      # One definition of how the image is started, used to start it and to redeploy it.
      BARBER_IMAGE_RUN: >-
        docker run -d --name barber-image -p 8103:8100
        --env-file barber-booking-api/.env.example -e DATABASE_URL=sqlite:////data/barber.db
        -v barber-data:/data barber-booking
    # The same framework, pointed at a product it shares no code with, through
    # config alone. It tests the barbershop's main as it is today: when that
    # product changes a rule, this job is meant to go red until someone decides
    # which of the two is right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { repository: DorGodin/barber-booking-api, path: barber-booking-api }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: start the barbershop, two workers, no test hooks
        working-directory: barber-booking-api
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.lock.txt
          cp .env.example .env
          set -a; . ./.env; set +a
          # The same copy `make run-test` starts: port 8101, its own database file.
          DATABASE_URL=sqlite:///./barber-test.db .venv/bin/python -m uvicorn app.main:create_app --factory --port 8101 --workers 2 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8101/health && exit 0; sleep 1; done
          echo "the barbershop never became healthy"; exit 1
      - run: pip install -r requirements.lock.txt
      - name: the mutation catalogue still matches the product
        # Seconds. A product change that moves code under a mutant's anchor must
        # update the catalogue in the same change, or the nightly run tests nothing.
        run: python scripts/mutate.py --product barber-booking-api --check
      - name: prove the environment first
        env: { ENV: barber }
        run: python scripts/env_check.py
      - name: the barbershop suites
        env: { ENV: barber }
        run: python -m pytest -q
      - uses: grafana/setup-k6-action@v1
      - name: the booking race under load - a double booking or a 5xx fails it
        env: { ENV: barber }
        run: python scripts/perf_run.py perf/barber/booking_race.js --profile load -e VUS=10 -e RAMP=2s -e HOLD=8s
      - name: install the browsers - Chromium, and WebKit for Safari
        # Usually two minutes. The system packages it installs have hung for an
        # hour once, and with no limit GitHub waits six. Each attempt gets six
        # minutes - a hang does not fail on its own, so `||` alone would never
        # retry it - and a second attempt, then the step fails.
        timeout-minutes: 14
        run: timeout 360 python -m playwright install --with-deps chromium webkit || timeout 360 python -m playwright install --with-deps chromium webkit
      - name: the booking page, in a real browser
        env: { ENV: barber }
        run: python -m pytest --ui tests/barber_ui -q --video retain-on-failure --tracing retain-on-failure --output reports/ui-barber
      - name: the booking page on an iPhone - every page test, on Safari's engine
        env: { ENV: barber }
        run: python -m pytest --ui tests/barber_ui -q --browser webkit --device "iPhone 13" --video retain-on-failure --tracing retain-on-failure --output reports/ui-barber/iphone
      - name: the booking page on an Android phone - every page test
        env: { ENV: barber }
        run: python -m pytest --ui tests/barber_ui -q --browser chromium --device "Pixel 7" --video retain-on-failure --tracing retain-on-failure --output reports/ui-barber/android
      - name: build the barbershop's image - what would be deployed - and start it
        # The page tests above run the product from source. A journey against the
        # image is the one that proves what ships: its dependencies, its user,
        # its database path. DATABASE_URL is set again because .env.example points
        # at ./barber.db, which the image's non-root user cannot write - compose
        # sets it the same way. The data lives on a named volume, as it would
        # where it is deployed.
        run: |
          docker build -q -t barber-booking barber-booking-api
          $BARBER_IMAGE_RUN
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8103/health && exit 0; sleep 1; done
          echo "the image never became healthy"; docker logs barber-image; exit 1
      - name: the journeys, end to end, against that image - a redeploy included
        env:
          ENV: barber-image
          # A redeploy is a new container on the same volume. The redeploy journey
          # books, redeploys, and checks the account, the booking and the sign-in
          # all survived.
          REDEPLOY_COMMAND: docker rm -f barber-image && $BARBER_IMAGE_RUN
        run: python -m pytest --ui tests/barber_ui/test_journeys.py -q -rs --video retain-on-failure --tracing retain-on-failure --output reports/ui-barber/image
      - name: keep the video and trace of any page test that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barber-ui-failures-${{ github.run_id }}
          path: reports/ui-barber
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: mutation - break the barbershop rule by rule (nightly)
    # A green suite proves the product passes it, not that the suite would fail if
    # the product broke. Every night each rule is broken on purpose and the suite
    # named for it must go red. Too slow for a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: { repository: DorGodin/barber-booking-api, path: barber-booking-api }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: the product's own virtualenv
        working-directory: barber-booking-api
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      # WebKit for the ui-webkit mutants: defects only Safari has survive a Chromium run.
      - run: python -m playwright install --with-deps chromium webkit
      - uses: grafana/setup-k6-action@v1
      - name: every mutant must be caught
        run: python scripts/mutate.py --product barber-booking-api
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}
          path: reports/mutation-barber-booking-api.json
          if-no-files-found: ignore
          retention-days: 30

  llm:
    name: llm evaluation (deepeval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.lock.txt
      - name: start demo API
        run: |
          python -m uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 0.5; done
      - run: ENV=ci PYTHONPATH=. pytest --llm tests/llm

  docker:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build and run the suites in containers
        run: docker compose run --rm tests
      - name: stop
        if: always()
        run: docker compose down -v

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Stated here, not left to the repository's default: on a pull request the
    # action reads its commits, and a token without pull-requests: read - the
    # one Dependabot's pull requests get - is refused with a 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
